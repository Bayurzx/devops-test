name: DevOps Assessment

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  # Manual trigger for rollback
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Image tag (commit SHA) to roll back to"
        required: true
        type: string

# ─── Variables ────────────────────────────────────────────────────────────────
# IMAGE_NAME uses ghcr.io with the repo owner/name automatically
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# ─── Secrets to configure in GitHub → Settings → Secrets → Actions ───────────
#   DEPLOY_HOST     - IP or hostname of the remote server
#   DEPLOY_USER     - SSH username on the remote server
#   DEPLOY_SSH_KEY  - Private SSH key for authentication
# Note: GITHUB_TOKEN is auto-provided — no setup needed for GHCR push
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Job 1: Install & Test ──────────────────────────────────────────────────
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # ── Job 2: Build Docker Image & Push to GHCR ──────────────────────────────
  build-and-push:
    needs: run-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ── Job 3: Deploy to Remote Server + Smoke Test ────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "Pulling image ${{ env.IMAGE_NAME }}:${{ github.sha }}..."
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop orgbyte-app || true
            docker rm orgbyte-app || true
            docker run -d --name orgbyte-app -p 3000:3000 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}
            echo "Deploy complete."

      - name: Smoke test - health endpoint
        run: |
          echo "Waiting for container to start..."
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}:3000/health || exit 1
          echo "Smoke test passed!"

  # ── Job 4: Manual Rollback (workflow_dispatch only) ─────────────────────────
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "Rolling back to ${{ github.event.inputs.rollback_tag }}..."
            docker pull ${{ env.IMAGE_NAME }}:${{ github.event.inputs.rollback_tag }}
            docker stop orgbyte-app || true
            docker rm orgbyte-app || true
            docker run -d --name orgbyte-app -p 3000:3000 \
              ${{ env.IMAGE_NAME }}:${{ github.event.inputs.rollback_tag }}
            echo "Rollback complete."

      - name: Smoke test after rollback
        run: |
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}:3000/health || exit 1
          echo "Rollback smoke test passed!"
